    <text x="587" y="215" fill="#f6ebff" font-size="22" font-weight="700">Smaller video</text>
    <text x="587" y="240" fill="#cdbad7" font-size="16">HEVC  ·  ADJUSTABLE QUALITY</text>
    <rect x="909" y="116" width="320" height="188" rx="16" fill="#332941" stroke="#9c80ad"/>
    <path d="M930 180h277" fill="none" stroke="#665174"/>
    <path d="M941 175v10m9-15v20m9-27v34m9-43v52m9-37v22m9-30v38m9-28v18m9-17v16m9-33v50m9-58v66m9-44v22m9-18v14m9-23v32m9-46v60m9-43v26m9-17v8m9-14v20m9-26v32m9-52v72m9-47v22m9-16v10m9-20v30m9-47v64m9-43v22m9-29v36m9-26v16m9-13v10m9-23v36m9-31v26m9-18v10" fill="none" stroke="#ffc3a7" stroke-width="3" stroke-linecap="round"/>
