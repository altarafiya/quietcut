      <path d="M567 71h293v106H567z" fill="url(#sky)"/>
      <circle cx="744" cy="113" r="25" fill="#ffe1b8"/>
      <path d="m567 175 61-52 33 26 38-44 75 63 38-31 48 32v10H567z" fill="#514465"/>
