[package]
name = "quietcut"
version = "1.8.0"
edition = "2024"
license = "MIT"
default-run = "quietcut"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webrtc-vad = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_HiDpi"] }
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[bin]]
name = "quietcut"
path = "src/main.rs"

[[bin]]
name = "quietcut-cli"
path = "src/cli.rs"
